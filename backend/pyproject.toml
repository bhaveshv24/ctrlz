[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrlz"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "crewai>=1.0,<2", "chromadb>=1,<2", "packaging>=24,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
