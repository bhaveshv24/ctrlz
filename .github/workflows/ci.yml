name: Verify CtrlZ
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CREWAI_TELEMETRY_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      RUN_DOCKER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --extra test --frozen
      - run: npm --prefix frontend ci
      - run: uv run --project backend python -m pytest -q
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CREWAI_TELEMETRY_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --extra test --frozen
      - run: docker compose up --build -d
      - run: uv run --project backend python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CTRLZ_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@localhost:5432/postgres
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --extra test --frozen
      - run: uv run --project backend python -m pytest backend/tests/test_postgres.py -q
